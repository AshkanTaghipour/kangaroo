<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Neural network nodes and connections -->
  <!-- Input layer -->
  <circle cx="140" cy="160" r="22" fill="#fff" opacity="0.95"/>
  <circle cx="140" cy="256" r="22" fill="#fff" opacity="0.95"/>
  <circle cx="140" cy="352" r="22" fill="#fff" opacity="0.95"/>
  <!-- Hidden layer -->
  <circle cx="256" cy="176" r="22" fill="#fff" opacity="0.95"/>
  <circle cx="256" cy="256" r="22" fill="#fff" opacity="0.95"/>
  <circle cx="256" cy="336" r="22" fill="#fff" opacity="0.95"/>
  <!-- Output layer -->
  <circle cx="372" cy="208" r="22" fill="#fff" opacity="0.95"/>
  <circle cx="372" cy="304" r="22" fill="#fff" opacity="0.95"/>
  <!-- Connections: input to hidden -->
  <line x1="162" y1="160" x2="234" y2="176" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="160" x2="234" y2="256" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="160" x2="234" y2="336" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="256" x2="234" y2="176" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="256" x2="234" y2="256" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="256" x2="234" y2="336" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="352" x2="234" y2="176" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="352" x2="234" y2="256" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="162" y1="352" x2="234" y2="336" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <!-- Connections: hidden to output -->
  <line x1="278" y1="176" x2="350" y2="208" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="278" y1="176" x2="350" y2="304" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="278" y1="256" x2="350" y2="208" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="278" y1="256" x2="350" y2="304" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="278" y1="336" x2="350" y2="208" stroke="#fff" stroke-width="3" opacity="0.5"/>
  <line x1="278" y1="336" x2="350" y2="304" stroke="#fff" stroke-width="3" opacity="0.5"/>
</svg>
